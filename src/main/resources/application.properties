# HTTP
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# JWT
mp.jwt.verify.issuer=devhub
# Dev: legge le chiavi da file classpath
%dev.mp.jwt.verify.publickey.location=publicKey.pem
%dev.smallrye.jwt.sign.key.location=privateKey.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
# Prod: legge le chiavi da env vars (contenuto PEM inline)
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.headers=Authorization,Content-Type,Cookie
quarkus.http.cors.exposed-headers=Set-Cookie
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.access-control-allow-credentials=true

# RATE LIMIT
# Prod runs behind Render's proxy: the client IP is the last X-Forwarded-For entry (appended by the proxy)
devhub.rate-limit.trust-forwarded-for=false
%prod.devhub.rate-limit.trust-forwarded-for=true

# DATASOURCE
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:devhub}
%prod.quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
# Neon scala a zero: timeout più alti per il cold start del DB
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.background-validation-interval=30
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Test: separate database, rebuilt from the migrations on every run (never point it at the dev database)
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/devhub_test
# Test only: wipe devhub_test and replay every migration on each run
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.hibernate-orm.log.sql=false

# DEV SERVICES
quarkus.datasource.devservices.enabled=false

# HIBERNATE
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true
# Schema is owned by Flyway (src/main/resources/db/migration): Hibernate only checks it at startup
quarkus.hibernate-orm.schema-management.strategy=validate

# FLYWAY
# Every schema change is a new V<n>__*.sql; never edit a migration that already ran.
# Databases created before Flyway (dev, prod) are baselined at V1 and only get V2+.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# AUTH
quarkus.http.auth.permission.authenticated.paths=/projects/*,/tasks/*,/notes/*,/users/*,/github/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.smallrye-jwt.enabled=true

# EMAIL
# Render free blocca le porte SMTP 25/465/587: in prod usare un provider su porta alternativa (es. 2525) via MAIL_HOST/MAIL_PORT
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.start-tls=REQUIRED

quarkus.mailer.username=${MAIL_USERNAME}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.auth-methods=LOGIN
quarkus.mailer.from=${MAIL_FROM:${MAIL_USERNAME}}
quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
# Dev: SMTP locale su Mailpit (docker-compose), UI su http://localhost:8025
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.start-tls=DISABLED
%dev.quarkus.mailer.tls=false
%dev.quarkus.mailer.login=DISABLED
%dev.quarkus.mailer.from=devhub@localhost

# ACCOUNT DELETION
# DELETE /users/me schedules the deletion; the hourly job purges accounts older than this (ISO-8601 duration)
devhub.account-deletion.grace-period=P7D
# Used in emails to link back to the app
devhub.frontend-url=${FRONTEND_ORIGIN:http://localhost:5173}

# GitHub OAuth app (https://github.com/settings/developers). Leave unset to disable the integration.
github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
# Frontend page GitHub redirects back to; must match the OAuth app's "Authorization callback URL".
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:5173/github/callback}
# Optional key for encrypting stored GitHub tokens (defaults to the client secret).
github.token-key=${GITHUB_TOKEN_KEY:}

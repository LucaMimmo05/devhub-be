name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major version as production (Neon)
        image: postgres:17
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: devhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub
      # Required by application.properties; the %test profile uses the mock mailer, nothing is sent
      MAIL_USERNAME: ci@example.test
      MAIL_PASSWORD: unused

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Throwaway key pair for signing test tokens; the real keys never leave the developer machine / Render
      - name: Generate test JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out src/main/resources/privateKey.pem
          openssl pkey -in src/main/resources/privateKey.pem -pubout -out src/main/resources/publicKey.pem

      - name: Test and package
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
